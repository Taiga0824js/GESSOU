name: Build GESSOU

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    name: Export Windows + macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Export with Godot 4.7.2
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: true
          archive_root_folder: true
          cache: true
          presets_to_export: Windows Desktop,macOS

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: GESSOU-builds
          path: ${{ steps.export.outputs.archive_directory }}/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            ${{ steps.export.outputs.archive_directory }}/* \
            --title "GESSOU ${GITHUB_REF_NAME}" \
            --generate-notes
